# Builds an installable Android APK on every push to main.
# The APK is attached to the "latest" release, so it can be downloaded
# straight onto a phone from the repository's Releases page.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: |
          if [ ! -d android ]; then
            flutter create . --org com.jonathangames --project-name marble_sort --platforms android
          fi
          dart run tool/configure.dart

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk marble-sort.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest marble-sort.apk \
            --title "Latest build ($(date -u +'%Y-%m-%d %H:%M') UTC)" \
            --notes "Built from ${GITHUB_SHA::7}. Download marble-sort.apk on your phone to install."
